name: Renitizer native foundations

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/native-verify.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/native-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-web
      - run: npx --no-install cap sync android
      - name: Compile debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-web
      - run: npx --no-install cap sync ios
      - name: Compile iOS simulator app without signing
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

  desktop-windows-check:
    name: Windows desktop Rust check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - name: Compile desktop shell without packaging or signing
        run: cargo check --manifest-path src-tauri/Cargo.toml
