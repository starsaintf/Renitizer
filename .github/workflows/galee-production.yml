name: Galee Labs Renitizer production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: galee-renitizer-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_owner == 'Galee-Labs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and run FFmpeg video-redaction smoke test
        run: |
          docker build --tag renitizer-video-smoke ./processor/video
          docker run --rm -e RENITIZER_FFMPEG_SMOKE=1 --entrypoint node --volume "$GITHUB_WORKSPACE/processor/video:/tests:ro" renitizer-video-smoke /tests/test/ffmpeg-smoke.mjs
      - name: Build and run LibreOffice document-cleaning smoke test
        run: |
          docker build --tag renitizer-document-smoke ./processor/document
          docker run --rm -e RENITIZER_LIBREOFFICE_SMOKE=1 --entrypoint node --volume "$GITHUB_WORKSPACE/processor/document:/tests:ro" renitizer-document-smoke /tests/test/libreoffice-smoke.mjs
      - name: Verify browser, Worker, and processor sources
        run: |
          node --check src/main.js
          node --check worker/src/index.js
          node --test test/*.test.js worker/test/*.test.js processor/video/test/filter.test.mjs processor/document/test_contract.mjs processor/document/test_runner.mjs
          python3 processor/document/test_office.py

  build-processors:
    if: github.repository_owner == 'Galee-Labs'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    strategy:
      matrix:
        processor: [video, document]
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish processor image
        uses: docker/build-push-action@v6
        with:
          context: ./processor/${{ matrix.processor }}
          push: true
          tags: |
            ghcr.io/galee-labs/renitizer-${{ matrix.processor }}:latest
            ghcr.io/galee-labs/renitizer-${{ matrix.processor }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Renitizer private ${{ matrix.processor }} processor

  deploy-worker:
    if: github.repository_owner == 'Galee-Labs'
    needs: [verify, build-processors]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Provision private Worker infrastructure and deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/provision-infrastructure.mjs
          wrangler deploy --config wrangler.toml
      - name: Apply private Worker secrets and deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
          PROCESSOR_AUTH_TOKEN: ${{ secrets.PROCESSOR_AUTH_TOKEN }}
          VIDEO_PROCESSOR_URL: ${{ secrets.VIDEO_PROCESSOR_URL }}
          DOCUMENT_PROCESSOR_URL: ${{ secrets.DOCUMENT_PROCESSOR_URL }}
          RENVOY_IDENTITY_VERIFICATION_URL: ${{ secrets.RENVOY_IDENTITY_VERIFICATION_URL }}
        run: |
          trap 'rm -f .worker-secrets.json' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['OPENAI_API_KEY', 'PROCESSOR_AUTH_TOKEN', 'VIDEO_PROCESSOR_URL', 'DOCUMENT_PROCESSOR_URL', 'RENVOY_IDENTITY_VERIFICATION_URL'];
          const missing = names.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing required production secrets: ${missing.join(', ')}`);
          writeFileSync('.worker-secrets.json', JSON.stringify({
            OPENAI_API_KEY: process.env.OPENAI_API_KEY,
            ...(process.env.GOOGLE_CLOUD_VISION_API_KEY ? { GOOGLE_CLOUD_VISION_API_KEY: process.env.GOOGLE_CLOUD_VISION_API_KEY } : {}),
            PROCESSOR_AUTH_TOKEN: process.env.PROCESSOR_AUTH_TOKEN,
            PROCESSOR_URL: process.env.VIDEO_PROCESSOR_URL,
            DOCUMENT_PROCESSOR_URL: process.env.DOCUMENT_PROCESSOR_URL,
            RENVOY_IDENTITY_VERIFICATION_URL: process.env.RENVOY_IDENTITY_VERIFICATION_URL,
          }));
          NODE
          node scripts/verify-processors.mjs
          wrangler secret bulk .worker-secrets.json --config wrangler.toml
          wrangler deploy --config wrangler.toml
